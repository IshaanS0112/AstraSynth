[pytest]
testpaths = tests
pythonpath = .
addopts = -q --strict-markers

# DeprecationWarnings from *our* code are errors: a warning nobody fails on is a
# warning nobody reads. Third-party ones are a different matter - they are not
# ours to fix, and letting an upstream release break an unrelated test suite
# turns a useful policy into a liability. Each exemption below names the library
# and the reason, so an unexplained `ignore` never accumulates.
filterwarnings =
    error::DeprecationWarning
    # starlette's TestClient imports `anyio.abc.BlockingPortal`, an alias anyio
    # deprecated in favour of `anyio.from_thread.BlockingPortal`. The import is
    # inside starlette; nothing in this repo can avoid it, and without this the
    # entire API suite errors on collection.
    ignore:The anyio\.abc\.BlockingPortal alias is deprecated:DeprecationWarning
