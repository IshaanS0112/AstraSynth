[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["storage"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear: likely bugs and design problems
    "C4",   # comprehension simplifications
    "UP",   # pyupgrade: modern syntax for the target version
    "SIM",  # simplifications
    "RUF",  # ruff-specific rules
    # Naive-datetime misuse. Earns its place: `datetime.utcnow()` is deprecated
    # from 3.12, this suite turns a DeprecationWarning into an error, and the
    # lint job runs on a version where nothing warns at runtime - so the queue's
    # lease writes passed locally and failed CI on 3.13. A lint rule catches it
    # on every version.
    "DTZ",
]
ignore = [
    "E501",    # line length is enforced by the formatter, not the linter
    "B008",    # FastAPI's Depends()/File()/Form() defaults are the framework idiom
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately reach into private helpers to check the validation and
# fallback paths that are not part of the public surface.
"tests/*" = ["SLF001"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.format]
quote-style = "double"
