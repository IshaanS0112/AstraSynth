server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress what compresses. The 3-D assets most of all (rover.glb is 2.9 MB,
    # 0.67 MB gzipped), and the API's terrain grids, which are JSON arrays of
    # floats. .glb and .hdr have no entry in nginx's mime.types and go out as
    # octet-stream, hence that type here. JPEG and WebP are left alone.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/octet-stream;

    # Vite fingerprints everything under /assets/, so a name never changes content.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The Blender outputs are not fingerprinted; a day, then revalidate.
    location /3d/ {
        expires 1d;
        try_files $uri =404;
    }

    # Client-side routing: unknown paths must fall through to the SPA shell,
    # not 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        client_max_body_size 25m;
    }

    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host $host;
    }
}
