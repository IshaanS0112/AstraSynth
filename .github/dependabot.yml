version: 2

# Two policies applied to every ecosystem below:
#
#   groups  - minor and patch bumps arrive as one PR per ecosystem rather than
#             one per package.
#
#   ignore  - major bumps are excluded. Dependabot cannot know that
#             tailwindcss 3->4 is a config-format rewrite, that
#             react-router-dom 6->7 changes the routing API, or that the pinned
#             scientific wheels do not yet reach the newest Python image. Each
#             arrived as its own unmergeable PR. Majors are done by hand.
updates:
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      # One PR per ecosystem rather than ten: patch bumps to FastAPI, pytest and
      # the SDKs are not worth reviewing individually.
      python-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    # Major bumps are excluded deliberately. Dependabot cannot know that
    # tailwindcss 3->4 is a config-format rewrite, that react-router-dom 6->7
    # changes the routing API, or that the pinned scientific wheels do not yet
    # reach the newest Python -- so each major arrives as its own PR that would
    # break the build if merged. Majors get done by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm-packages:
        patterns: ["*"]
        update-types: ["minor", "patch"]

    # Major bumps are excluded deliberately. Dependabot cannot know that
    # tailwindcss 3->4 is a config-format rewrite, that react-router-dom 6->7
    # changes the routing API, or that the pinned scientific wheels do not yet
    # reach the newest Python -- so each major arrives as its own PR that would
    # break the build if merged. Majors get done by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

    # Major bumps are excluded deliberately. Dependabot cannot know that
    # tailwindcss 3->4 is a config-format rewrite, that react-router-dom 6->7
    # changes the routing API, or that the pinned scientific wheels do not yet
    # reach the newest Python -- so each major arrives as its own PR that would
    # break the build if merged. Majors get done by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: docker
    directory: /backend
    schedule:
      interval: monthly

    # Major bumps are excluded deliberately. Dependabot cannot know that
    # tailwindcss 3->4 is a config-format rewrite, that react-router-dom 6->7
    # changes the routing API, or that the pinned scientific wheels do not yet
    # reach the newest Python -- so each major arrives as its own PR that would
    # break the build if merged. Majors get done by hand, on purpose.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]