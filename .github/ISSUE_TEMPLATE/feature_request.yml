name: Feature request
description: Propose a capability the system does not have
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: >
        If it touches the analysis pipeline, say which stage - terrain, hazard,
        planner, risk, or report - and whether it changes any documented number.
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      description: See the scope section of the README.
      options:
        - label: This does not require real rover hardware or live telemetry
        - label: This does not claim validation against real mission data
