name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound and current release. The compiled dependencies are
        # version-ranged rather than pinned specifically so both resolve.
        python-version: ["3.10", "3.13"]

    services:
      # The API tests exercise the real schema, which uses PostgreSQL JSONB and
      # native UUID columns. Those have no SQLite equivalent, so the suite skips
      # them unless a database is reachable - without this service block CI would
      # report success while silently running 84 of 90 tests.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: astra
          POSTGRES_PASSWORD: astra
          POSTGRES_DB: astrasynth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U astra -d astrasynth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run test suite
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://astra:astra@localhost:5432/astrasynth
        run: python -m pytest -v

      - name: Assert the database-backed tests actually ran
        # A skipped test is not a passing test. If the service container ever
        # stops being reachable the suite would still exit 0 with everything
        # skipped, so the count is checked explicitly.
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://astra:astra@localhost:5432/astrasynth
        run: |
          set -euo pipefail
          python -m pytest -q --no-header -p no:cacheprovider tests/test_api.py | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "::error::API tests were skipped - PostgreSQL service unreachable"
            exit 1
          fi

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.9.2
      - name: Ruff check
        run: ruff check .
      - name: Ruff format check
        run: ruff format --check .

  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pipeline-smoke:
    name: End-to-end pipeline (no database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Generate terrain and run the full analysis pipeline
        # Guards the documented numbers: if a change to the CV pipeline, the
        # planner or the risk engine altered a result, this fails.
        run: |
          python scripts/generate_terrain.py --size 256
          python scripts/run_pipeline_demo.py \
            data/sample_terrain/synthetic_crater_field_256.png \
            --rover survey --compare-dijkstra
      - name: A* must expand fewer nodes than Dijkstra at equal cost
        run: python scripts/benchmark_planner.py --grid 64 128 --repeats 1
